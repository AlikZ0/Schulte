<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="color-scheme" content="dark" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Schulte" />
    <meta name="mobile-web-app-capable" content="yes" />

    <meta name="format-detection" content="telephone=no" />
    <meta
      name="description"
      content="Schulte Trainer — sharpen focus, peripheral vision and reaction speed across 100 progressively harder levels and beyond."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lexend:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />

    <title>Schulte Trainer · Focus · Speed · Memory</title>

    <style>
      /* Pre-paint splash so the very first frame already feels branded. */
      .boot-splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 30%, #1b1b2c 0%, #0a0a0f 60%);
        z-index: 9999;
      }
      .boot-splash__mark {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        background: linear-gradient(135deg, #7c5cff, #22d3ee);
        box-shadow: 0 0 32px rgba(124, 92, 255, 0.5);
        display: grid;
        place-items: center;
        color: #0a0a0f;
        font: 800 28px/1 Inter, system-ui, sans-serif;
        animation: bootPulse 1.4s ease-in-out infinite;
      }
      @keyframes bootPulse {
        0%, 100% { transform: scale(1); }
        50%      { transform: scale(1.07); }
      }
    </style>
  </head>
  <body class="bg-bg text-white antialiased">
    <div id="root"></div>
    <div class="boot-splash" id="boot-splash">
      <div class="boot-splash__mark">S</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
